<!doctype html><meta charset="utf-8"><title>LVLITUP test</title><button id="media">Start media source</button><button id="tone">Start Web Audio tone</button><button id="loud">Loud noise / clip</button><button id="stop">Stop all</button><p>A remote, cross-origin audio element without a crossorigin attribute would use Limited mode; this self-contained page does not fetch network media.</p><audio id="a" controls></audio><script>let ctx,osc,gain,noise;function wav(){let n=44100,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,44100,true);v.setUint32(28,88200,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);for(let i=0;i<n;i++)v.setInt16(44+i*2,Math.sin(i/20)*10000,true);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}media.onclick=()=>{a.src=wav();a.loop=true;a.play()};tone.onclick=()=>{ctx||=new AudioContext();osc=ctx.createOscillator();gain=ctx.createGain();gain.gain.value=.15;osc.connect(gain).connect(ctx.destination);osc.start()};loud.onclick=()=>{ctx||=new AudioContext();let b=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate),d=b.getChannelData(0);d.forEach((_,i)=>d[i]=(Math.random()*2-1)*2);noise=ctx.createBufferSource();noise.buffer=b;noise.loop=true;noise.connect(ctx.destination);noise.start()};stop.onclick=()=>{a.pause();[osc,noise].forEach(x=>{try{x.stop()}catch(_){}})}</script>
